# =============================================================================
# Climate Brain — configuration  (George's "Home automation" project, India DC)
#
# Device credentials live in .env (TUYA_ACCESS_ID / TUYA_ACCESS_SECRET).
# With no .env the whole thing runs in SIMULATION mode.
# =============================================================================

poll_seconds: 10               # faster ambient reaction — nothing should sit buffered
min_dwell_seconds: 0           # zero hold — every tick reacts immediately, no buffering at all
cooler_max_runtime_min: 180    # dry-tank guard (no water sensor)
sensor_stale_seconds: 900      # no fresh reading this long -> failsafe

thresholds:
  cooler_on_hi: 27.5    # raw-temp "raw heat" trigger — matches the live Google Home script exactly
  cooler_off_hi: 26.5   # ... and OFF (Google Home's own hysteresis gap)
  muggy_early_temp: 26.8  # "feels hotter than it is" early trigger — see muggy_early_rh
  muggy_early_rh: 65.0    # ... humidity threshold for that same early trigger
  hot_hi: 29.0
  comfort_lo: 27.2        # fan floor — off below this, gradual ramp from here through cooler_on_hi and beyond
  heater_on_t: 26.5        # bang-bang, no gap — instant full heat below this (independent of the fan floor)
  heater_off_t: 26.5       # ... same value: no hysteresis, matches "don't care about switching"
  spread_excellent: 9.0
  spread_good: 7.0
  spread_muggy: 5.0
  rh_muggy: 70.0
  rh_hardlock: 75.0
  fan_cap: 5   # no cap — full 1-5 range always available

night:
  start: "23:00"
  end: "06:00"
  fan_cap: 3

cooldown:                     # away at office — rest fan/heater/LED regardless of climate
  weekdays: [0, 1, 2, 3]       # Mon-Thu (0=Monday ... 6=Sunday)
  start: "11:00"
  end: "17:30"

manual_override_minutes: 30   # how long a dashboard manual command blocks automation

# --- self-learning: real-time escalation + once-daily bounded threshold tuning
learning:
  enabled: true
  escalate_after_min: 20        # if a mode/fan combo underperforms this long, escalate
  min_cool_rate_c_per_min: 0.03 # below this, cooling is "not working" -> escalate
  autotune:
    enabled: true
    step: 0.2                   # max °C nudge per threshold per day
    min_samples: 20              # need at least this many logged ticks before tuning
    bounds:                     # [min, max] — thresholds never drift outside these
      cooler_on_hi: [27.0, 28.5]
      cooler_off_hi: [26.0, 27.5]
      heater_on_t: [26.5, 27.5]
      heater_off_t: [26.5, 27.5]
      spread_good: [5.0, 9.0]

# --- power-outage detection: watch these Tuya devices' online/offline status
outage_watch:
  device_ids: ["d73d1055a9e5f5af92yods", "d7b8d9fc6b8198fe09yb8f"]  # fan + ir hub

# --- Tuya Cloud devices (discovered from the IoT platform) -------------------
devices:
  sensor:
    id: "d7802e582e33449a8bx6ao"
    code_temp: "va_temperature"
    temp_divisor: 10            # raw 260 -> 26.0 C
    code_humidity: "va_humidity"
    humidity_divisor: 1         # raw 64 -> 64 %

  fan:
    id: "d73d1055a9e5f5af92yods"
    code_power: "switch_fan"      # bool
    code_speed: "fan_speed_enum"  # string "1".."5"
    speed_values: ["1", "2", "3", "4", "5"]   # brain speed 1..5 -> these

  ir_hub:
    id: "d7b8d9fc6b8198fe09yb8f"

  heater:                        # Kanupriya handy heater, learned IR remote
    remote_id: "d7c92742587535876dvviu"
    # Real remote behavior (confirmed by George, not guessed):
    #   power   — single toggle pulse. Powering ON resets the unit's OWN state
    #             to temp=25C, fan=HIGH, timer=0(off) — hardware default, not
    #             ours to choose. We resync tracked state to match on every ON.
    #   temp    — a REAL thermostat, 15-32C, one pulse per 1 degree via
    #             increase/decrease. We just tell it the setpoint; its own
    #             thermostat does the fine control — we don't reinvent that.
    #   fan     — strict 2-state cycle HIGH<->LOW, one pulse always flips it.
    #   timer   — 13-state cycle 0(off)..12h, one-directional (no decrease).
    #             Not used by automation (our own loop already decides
    #             on/off every 30s) — wired in for a future manual control.
    code_power: ""
    code_increase: "af249b11540254025402540254025402540254025402540254025402540254025402540254027f0654027f0654027f0654027f0654027f0654027f0654027f0654027f0654027f06540254025402540254027f06540254025402540254025402540254025402540254027f0654027f065402540254027f0654027f0654027f0654027f0654022c9aaf249e085402d0fb"
    code_decrease: ""
    code_fan: ""
    code_timer: ""
    # NOTE: no fixed thermostat_target — the heater's own internal sensor sits
    # right next to its own heat output and would under-read the room. The
    # temp dial is instead an INTENSITY KNOB our loop computes fresh every
    # tick from OUR WiFi sensor (see brain.heater_dial()) — the heater never
    # self-regulates, our sensor is the only source of truth.

